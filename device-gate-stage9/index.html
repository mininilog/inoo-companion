<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf8ff">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inoo DB Gate">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Inoo Companion · Device Storage Gate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="device-gate.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="eyebrow">RC11 DEVICE GATE · ISOLATED TEST SITE</div>
    <h1>실기기 저장소 진단</h1>
    <p class="sub">제품 USER DB는 건드리지 않고 별도 진단용 IndexedDB에서만 테스트합니다.</p>
    <div id="gateStatus" class="status">아직 실행하지 않았습니다.</div>
    <button id="gateRun" class="primary" type="button">진단 실행</button>
    <button id="gateReload" class="secondary" type="button" hidden>새로고침 후 persistence 재검사</button>
    <button id="gateCopy" class="secondary" type="button" hidden>진단 결과 복사</button>
    <pre id="gateResult" class="result" hidden></pre>
    <p class="fine">이 페이지의 PASS는 현재 저장 컨테이너에서의 관찰 결과입니다. Safari 탭, iPhone 홈 화면 웹 앱, Android Chrome 탭, Android 설치형 웹 앱은 각각 별도로 검사하세요.</p>
  </section>
</main>
<script src="device_gate.js"></script>
</body>
</html>
